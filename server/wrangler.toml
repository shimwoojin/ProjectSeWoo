name = "punchmonkey-economy"
main = "src/index.ts"
compatibility_date = "2026-09-23"

# `npm run db:create` 가 실제 database_id 를 찍어준다. 그 값을 여기 넣기 전까지는
# `wrangler dev`/`deploy` 가 D1 바인딩을 못 찾는다 - server/README.md §1 참고.
[[d1_databases]]
binding = "DB"
database_name = "punchmonkey-economy"
database_id = "d36cbd34-76c0-4568-8fd1-2bd7b955055e"

# 시크릿(STEAM_PUBLISHER_WEB_API_KEY, SESSION_SIGNING_SECRET)은 여기 안 적는다.
# `wrangler secret put`으로 넣는다 - 이 파일은 커밋되는 파일이다.
[vars]
STEAM_APP_ID = "5281130"
